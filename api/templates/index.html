<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wash Wiki Chat</title>
  <link rel="icon" href="/favicon.ico" type="image/svg+xml">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      max-width: 480px;
      margin: auto;
      min-height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #f0f0f0;
      font-family: Arial, sans-serif;
    }

    .header {
      background: #2e7d32;
      color: white;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    .lang-toggle {
      background: white;
      color: #2e7d32;
      border: none;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
    }

    .topic-bar {
      background: white;
      overflow-x: auto;
      display: flex;
      flex-direction: row;
      gap: 8px;
      padding: 8px 12px;
      position: sticky;
      top: 48px;
      z-index: 1;
    }

    .topic-btn {
      background: #e8f5e9;
      border: 1px solid #a5d6a7;
      border-radius: 16px;
      white-space: nowrap;
      padding: 8px 12px;
      cursor: pointer;
    }

    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .quick-reply-group {
      max-width: 80%;
      align-self: flex-start;
      margin-top: -2px;
      margin-bottom: 2px;
    }

    .quick-reply-btn {
      background: #e8f5e9;
      border: 1px solid #a5d6a7;
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }

    .quick-reply-btn:hover {
      background: #c8e6c9;
    }

    .chat-area {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px;
    }

    .msg {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 12px;
      line-height: 1.4;
    }

    .bot {
      background: white;
      border: 1px solid #ddd;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }

    .user {
      background: #dcf8c6;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }

    .warning {
      background: #fff3e0;
      border: 1px solid #ffcc80;
      color: #e65100;
      align-self: flex-start;
    }

    .steps {
      background: #e3f2fd;
      border: 1px solid #90caf9;
      align-self: flex-start;
    }

    .typing {
      background: white;
      border: 1px solid #ddd;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
      font-style: italic;
      color: grey;
    }

    .input-row {
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      flex-direction: row;
      gap: 8px;
      padding: 12px;
      position: sticky;
      bottom: 0;
      z-index: 2;
    }

    input {
      flex: 1;
      border: 1px solid #ccc;
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 14px;
    }

    button[type=submit] {
      background: #2e7d32;
      color: white;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      cursor: pointer;
      font-size: 16px;
    }

    ol {
      margin: 0;
      padding-left: 20px;
    }

    @media (max-width: 600px) {
      body {
        max-width: 100%;
        margin: 0;
        padding: 0;
      }

      .header {
        padding: 10px 12px;
      }

      .topic-bar {
        padding: 8px 10px;
        top: 44px;
      }

      .chat-area {
        padding: 10px;
        gap: 8px;
      }

      .msg {
        max-width: 92%;
        font-size: 14px;
      }

      .input-row {
        padding: 10px;
        gap: 6px;
      }

      input {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <div>Wash Wiki Chat</div>
    <button class="lang-toggle" id="lang-toggle" type="button">EN / SN</button>
  </div>
  <div class="topic-bar">
    <button class="topic-btn" type="button">water safety</button>
    <button class="topic-btn" type="button">handwashing</button>
    <button class="topic-btn" type="button">sanitation</button>
    <button class="topic-btn" type="button">disease prevention</button>
  </div>
  <div class="chat-area" id="chat-area"></div>
  <div class="input-row">
    <input id="message-input" type="text" placeholder="Type your message">
    <button id="send-button" type="submit" aria-label="Send">&#10148;</button>
  </div>

  <script>
    let currentLanguage = "shona";

    document.addEventListener("DOMContentLoaded", () => {
      if (!sessionStorage.getItem("session_id")) {
        sessionStorage.setItem("session_id", generateSessionId());
      }

      appendMessage("Mhoro! Welcome to Wash Wiki. Ndibvunzei nezvemvura, kugeza maoko, zvimbuzi, kana kudzivirira zvirwere.", "bot");

      document.getElementById("lang-toggle").addEventListener("click", () => {
        if (currentLanguage === "shona") {
          sendMessage("speak English");
        } else {
          sendMessage("taura chiShona");
        }
      });

      document.querySelectorAll(".topic-bar .topic-btn").forEach((button) => {
        button.addEventListener("click", () => {
          sendMessage(button.textContent);
        });
      });

      document.getElementById("send-button").addEventListener("click", () => {
        sendMessage(document.getElementById("message-input").value.trim());
      });

      document.getElementById("message-input").addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          sendMessage(event.target.value.trim());
        }
      });
    });

    function generateSessionId() {
      if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") {
        return crypto.randomUUID();
      }

      if (typeof crypto !== "undefined" && typeof crypto.getRandomValues === "function") {
        const bytes = new Uint8Array(16);
        crypto.getRandomValues(bytes);
        bytes[6] = (bytes[6] & 0x0f) | 0x40;
        bytes[8] = (bytes[8] & 0x3f) | 0x80;
        const hex = Array.from(bytes, (b) => b.toString(16).padStart(2, "0"));
        return `${hex.slice(0, 4).join("")}-${hex.slice(4, 6).join("")}-${hex.slice(6, 8).join("")}-${hex.slice(8, 10).join("")}-${hex.slice(10, 16).join("")}`;
      }

      return `session-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
    }

    function appendMessage(text, className) {
      const chatArea = document.getElementById("chat-area");
      const message = document.createElement("div");
      message.className = `msg ${className}`;
      message.textContent = text;
      chatArea.appendChild(message);
      scrollToBottom();
      return message;
    }

    function sendMessage(text) {
      if (!text) {
        return;
      }

      const sessionId = sessionStorage.getItem("session_id");
      const input = document.getElementById("message-input");

      appendMessage(text, "user");
      input.value = "";

      const typingIndicator = appendMessage("...", "typing");

      fetch("/message", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          session_id: sessionId,
          user_message: text,
          language: currentLanguage
        })
      })
        .then((response) => response.json())
        .then((data) => {
          typingIndicator.remove();
          renderResponse(data);
        })
        .catch(() => {
          typingIndicator.remove();
          appendMessage("Unable to reach the server. Please try again.", "bot");
        });
    }

    function appendQuickReplies(items) {
      const chatArea = document.getElementById("chat-area");
      const quickReplyGroup = document.createElement("div");
      quickReplyGroup.className = "quick-reply-group";
      const quickReplies = document.createElement("div");
      quickReplies.className = "quick-replies";

      items.forEach((item, index) => {
        const button = document.createElement("button");
        button.className = "quick-reply-btn";
        button.type = "button";
        button.textContent = item;
        button.dataset.elementId = `qr-${index}`;
        button.addEventListener("click", () => sendMessage(item));
        quickReplies.appendChild(button);
      });

      quickReplyGroup.appendChild(quickReplies);
      chatArea.appendChild(quickReplyGroup);
    }

    function renderResponse(data) {
      const chatArea = document.getElementById("chat-area");

      appendMessage(data.response_text, "bot");

      if (Array.isArray(data.steps) && data.steps.length > 0) {
        const steps = document.createElement("div");
        steps.className = "msg steps";
        const list = document.createElement("ol");

        data.steps.forEach((step) => {
          const item = document.createElement("li");
          item.textContent = step;
          list.appendChild(item);
        });

        steps.appendChild(list);
        chatArea.appendChild(steps);
      }

      if (data.warning) {
        appendMessage(`⚠️ ${data.warning}`, "warning");
      }

      if (data.follow_up) {
        appendMessage(data.follow_up, "bot");
      }

      if (data.is_fallback && Array.isArray(data.topic_menu) && data.topic_menu.length > 0) {
        appendQuickReplies(data.topic_menu);
      }

      currentLanguage = data.language;
      scrollToBottom();
    }

    function scrollToBottom() {
      const chatArea = document.getElementById("chat-area");
      chatArea.scrollTop = chatArea.scrollHeight;
    }
  </script>
</body>
</html>
